name: Build

# `on: [push, pull_request]` ran this twice for every branch pushed to this
# repo — once for the push, once for the PR — which doubles a ~9 minute
# Notion-backed build for no extra signal. Build pushes to main (the branch
# Vercel deploys to production) and every PR, and nothing twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer commit makes an in-flight build obsolete; don't hold a runner for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the Node major that Vercel builds with (project setting: 18.x)
      # so a build can't pass here and fail there.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: lint
        run: npm run test:lint

      # This is the step that actually protects production: `next build`
      # prerenders every page through the Notion API, so it fails here for the
      # same reasons the Vercel build fails (403 / rate limits / missing pages)
      # — before the commit reaches the production deployment.
      - name: build
        #        TODO Enable those lines below if you use a Redis cache, you'll also need to configure GitHub Repository Secrets
        #        env:
        #          REDIS_HOST: ${{ secrets.REDIS_HOST }}
        #          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: npm run build
